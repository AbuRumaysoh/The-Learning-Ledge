<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact | The Learning Ledge</title>
    <link
      rel="shortcut icon"
      href="../assets/icons/The_Learning_Ledge_Padded_Favicon.png"
    />
    <link rel="stylesheet" href="./css/public-pages.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <header class="page-header">
      <div class="inner">
        <a class="brand-link" href="./index.html"
          ><img src="../assets/images/Logo Icon.png" alt="" /><span
            >The <span>Learning</span> Ledge</span
          ></a
        >
        <nav class="page-nav">
          <a class="" href="./index.html">Home</a
          ><a class="" href="./about.html">About</a
          ><a class="" href="./features.html">Features</a
          ><a class="" href="./subjects.html">Subjects</a
          ><a class="" href="./faq.html">FAQ</a
          ><a class="active" href="./contact.html">Contact</a
          ><a class="page-cta" href="./signup.html">Get Started</a>
        </nav>
      </div>
    </header>
    <section class="hero-mini">
      <div class="container">
        <div class="eyebrow">The Learning Ledge</div>
        <h1>We would love to hear from you.</h1>
        <p class="lead">
          Use the simple form below for questions, feedback or suggestions.
        </p>
      </div>
    </section>
    <main class="container">
      <div class="card form-card">
        <form
          onsubmit="
            event.preventDefault();
            document.getElementById('sent').textContent =
              'Thanks! Your message has been recorded for this demo.';
          "
        >
          <div class="field">
            <label>Name</label><input required placeholder="Your name" />
          </div>
          <div class="field">
            <label>Email</label
            ><input type="email" required placeholder="you@example.com" />
          </div>
          <div class="field">
            <label>Message</label
            ><textarea required placeholder="How can we help?"></textarea>
          </div>
          <button class="btn-main">Send Message</button>
          <p
            id="sent"
            style="margin-top: 12px; color: #0ea271; font-weight: 600"
          ></p>
        </form>
      </div>
    </main>
    <footer class="footer-simple">
      © 2026 The Learning Ledge · <a href="./privacy.html">Privacy</a> ·
      <a href="./terms.html">Terms</a>
    </footer>
  </body>
</html>
